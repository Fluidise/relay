[package]
name = "fluidise-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT"

[dependencies]
lexopt = "0.3.2"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "event", "process"] }
signal-hook = { version = "0.4.5", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }

nix = { version = "0.31.3", default-features = false, features = ["process", "signal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Recovery tests repeatedly hash native delegates; keep this work optimized.
[profile.test]
opt-level = 1

[package.metadata.dist]
cargo-dist-version = "0.28.0"
rust-toolchain-version = "1.99.1"
ci = ["github"]
installers = ["shell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
