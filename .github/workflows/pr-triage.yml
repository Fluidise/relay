name: PR Triage

on:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  pull-requests: write
  contents: read

jobs:
  triage:
    name: Triage Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Auto-assign author and apply conventional labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          # 1. Auto-assign PR author upon creation
          if [ "$ACTION" = "opened" ]; then
            echo "Assigning PR author @$PR_AUTHOR..."
            gh pr edit "$PR_URL" --add-assignee "$PR_AUTHOR"
          fi

          # 2. Determine type label from branch prefix or Conventional Commit title
          TYPE_LABEL=""
          case "$BRANCH" in
            feat/*) TYPE_LABEL="feat" ;;
            fix/*) TYPE_LABEL="fix" ;;
            chore/*) TYPE_LABEL="chore" ;;
            docs/*) TYPE_LABEL="docs" ;;
            ci/*) TYPE_LABEL="ci" ;;
            refactor/*) TYPE_LABEL="refactor" ;;
            test/*) TYPE_LABEL="test" ;;
            perf/*) TYPE_LABEL="perf" ;;
            build/*) TYPE_LABEL="build" ;;
            *)
              if [[ "$TITLE" =~ ^(feat|fix|chore|docs|ci|refactor|test|perf|build)(\([a-zA-Z0-9_-]+\))?!?: ]]; then
                TYPE_LABEL="${BASH_REMATCH[1]}"
              fi
              ;;
          esac

          DESIRED_LABELS=()
          [ -z "$TYPE_LABEL" ] || DESIRED_LABELS+=("$TYPE_LABEL")

          # 3. Detect breaking changes
          if [[ "$TITLE" =~ ^[a-z]+(\([^\)]+\))?!: ]] || [[ "$BODY" =~ BREAKING[[:space:]]CHANGE: ]]; then
            DESIRED_LABELS+=("breaking-change")
          fi

          # 4. Manage review status label based on draft status
          if [ "$IS_DRAFT" = "true" ]; then
            DESIRED_LABELS+=("work-in-progress")
          else
            DESIRED_LABELS+=("needs-review")
          fi

          # Reconcile owned labels after edits; preserve all unrelated labels.
          CURRENT_LABELS="$(gh pr view "$PR_URL" --json labels --jq '.labels[].name')"
          LABEL_ARGS=()
          for label in "${DESIRED_LABELS[@]}"; do
            LABEL_ARGS+=(--add-label "$label")
          done
          while IFS= read -r label; do
            case "$label" in
              feat|fix|chore|docs|ci|refactor|test|perf|build|breaking-change|work-in-progress|needs-review)
                keep=false
                for desired in "${DESIRED_LABELS[@]}"; do
                  if [ "$label" = "$desired" ]; then
                    keep=true
                    break
                  fi
                done
                if [ "$keep" = false ]; then
                  LABEL_ARGS+=(--remove-label "$label")
                fi
                ;;
            esac
          done <<< "$CURRENT_LABELS"
          gh pr edit "$PR_URL" "${LABEL_ARGS[@]}"
