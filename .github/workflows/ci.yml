name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & MSRV
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; explicit stable toolchain
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Validate PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CONVENTIONAL_REGEX='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: .+$'
          if ! printf '%s\n' "$PR_TITLE" | grep -qE "$CONVENTIONAL_REGEX"; then
            echo "❌ PR title does not adhere to Conventional Commits: '$PR_TITLE'" >&2
            echo "Expected: <type>(<optional scope>)[!]: <description>" >&2
            exit 1
          fi
          echo "✅ PR title is valid: '$PR_TITLE'"

      - name: Verify MSRV (Rust 1.99.1)
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          cargo +1.99.1 check --locked --all-targets

      - name: Security audit
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1
        with:
          createIssues: false

      - name: License and supply-chain audit (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  test:
    name: Test (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; explicit stable toolchain
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}

      - name: Run Tests
        run: cargo test --locked --all-targets

  coverage:
    name: Coverage (Linux)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable with LLVM tools
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; explicit stable toolchain
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo +stable install cargo-llvm-cov --version 0.9.1 --locked

      - name: Generate coverage
        run: |
          mkdir -p target/coverage
          cargo +stable llvm-cov --locked --all-targets --lcov --output-path target/coverage/lcov.info
          test -s target/coverage/lcov.info
          grep -Eq '^SF:(.*/)?src/main[.]rs$' target/coverage/lcov.info
          grep -Eq '^DA:[0-9]+,[1-9][0-9]*(,.*)?$' target/coverage/lcov.info

      - name: Preserve coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Explain fork upload policy
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'Codecov upload skipped for fork PR; coverage is available in the coverage-linux artifact.' >> "$GITHUB_STEP_SUMMARY"

  codecov:
    name: Upload coverage to Codecov
    needs: coverage
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # Do not run repository scripts or tests in this credential-bearing job.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download coverage report from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-linux
          path: target/coverage

      - name: Upload coverage
        id: upload
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          version: v11.3.1
          files: target/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

      - name: Report upload failure without blocking the pilot
        if: steps.upload.outcome == 'failure'
        run: |
          echo '::warning::Codecov upload failed; the coverage-linux artifact remains available. The pilot is not validated.'
          echo 'Codecov upload failed. Inspect the upload logs and coverage-linux artifact; the pilot is not validated.' >> "$GITHUB_STEP_SUMMARY"

  auto-merge:
    name: Auto-merge PR
    needs: [test, coverage, codecov]
    # A fork deliberately skips upload, but must still pass both test suites.
    if: >-
      ${{ !cancelled() &&
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      needs.test.result == 'success' && needs.coverage.result == 'success' &&
      (needs.codecov.result == 'success' ||
       (needs.codecov.result == 'skipped' && github.event.pull_request.head.repo.full_name != github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch
