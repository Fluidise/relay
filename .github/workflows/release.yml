name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v0.1.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Require an existing version-matched tag
        id: source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os, re, subprocess, tomllib
          tag = os.environ["TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Expected a stable vMAJOR.MINOR.PATCH tag")
          sha = subprocess.check_output(["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", sha, "origin/main"], check=True)
          manifest = subprocess.check_output(["git", "show", f"{sha}:Cargo.toml"], text=True)
          if tag != "v" + tomllib.loads(manifest)["package"]["version"]:
              raise SystemExit("Tag and Cargo package version differ")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\nsha={sha}\n")
          PYTHON

  candidate:
    needs: source
    uses: ./.github/workflows/distribution.yml
    with:
      source: ${{ needs.source.outputs.sha }}

  publish:
    name: Publish Official GitHub Release
    needs: [source, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up release validation Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disclose the approved unsigned release policy
        run: |
          cat >> RELEASE_NOTES.md <<'EOF'

          ## Publisher signing policy for 0.1.0

          These binaries have no publisher signature and are not Apple-notarized.
          SHA256SUMS verifies integrity relative to a trusted checksum, not publisher identity.
          No instructions to bypass operating-system security checks are provided.
          EOF

      - name: Download all candidate archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          pattern: relay-candidate-*
          merge-multiple: true

      - name: Enforce public distribution eligibility
        env:
          TAG: ${{ needs.source.outputs.tag }}
          SOURCE: ${{ needs.source.outputs.sha }}
        run: python scripts/distribution.py verify-release --distribution release-assets --tag "$TAG" --source "$SOURCE"

      - name: Generate consolidated SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          echo "Consolidated checksums:"
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --title "fluidise-relay $TAG" \
            --notes-file RELEASE_NOTES.md
