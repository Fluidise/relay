name: Release & Changelog

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to process (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; explicit stable toolchain
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tooling
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package release archive
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="${TAG:-${{ github.event.inputs.tag }}}"
          ARCHIVE_NAME="fluidise-relay-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "target/${TARGET}/release/fluidise-relay" "dist/${ARCHIVE_NAME}/"
          cp README.md LICENSE "dist/${ARCHIVE_NAME}/"
          cd dist
          tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz*
          retention-days: 7

  publish:
    name: Publish Release & Update Changelog
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          mkdir -p release-assets
          cp artifacts/*.tar.gz* release-assets/
          cd release-assets
          cat *.tar.gz.sha256 > SHA256SUMS.txt
          echo "Aggregated SHA256 checksums:"
          cat SHA256SUMS.txt

      - name: Generate Release Notes with git-cliff
        id: git-cliff-release
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="${TAG:-${{ github.event.inputs.tag }}}"
          PRERELEASE_FLAG=""
          if [[ "$RELEASE_TAG" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Uploading assets and updating release notes for $RELEASE_TAG..."
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md $PRERELEASE_FLAG
          else
            echo "Creating new release $RELEASE_TAG with git-cliff notes..."
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "fluidise-relay $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md \
              $PRERELEASE_FLAG
          fi

      - name: Prepare main branch for changelog update
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Generate complete CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push updated CHANGELOG.md to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain CHANGELOG.md | grep -q "CHANGELOG.md"; then
            echo "CHANGELOG.md modified. Committing and pushing back to main..."
            git add CHANGELOG.md
            git commit -m "chore(release): update CHANGELOG.md for ${{ github.ref_name || github.event.inputs.tag }} [skip ci]"
            if ! git push origin main; then
              echo "::warning::Direct push to main was declined by GitHub branch protection. Ensure GITHUB_TOKEN has push permissions or configure a release PR bypass."
              exit 1
            fi
          else
            echo "CHANGELOG.md is already up to date."
          fi
